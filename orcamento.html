<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1e3a5f">
  <meta name="description" content="Protótipo do ConectaES, plataforma para contratar pedreiros autônomos na Grande Vitória (ES).">
  <title>Pedir orçamento · ConectaES</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icones/icone-192.png">
  <link rel="apple-touch-icon" href="icones/icone-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <!-- Pedido de orçamento ao pedreiro escolhido (RF05) -->
  <header class="cabecalho">
    <a class="voltar" id="voltar" href="busca.html" aria-label="Voltar"></a>
    <h1>Pedir orçamento</h1>
  </header>

  <main class="conteudo">
    <div class="cartao linha" id="para-quem"></div>

    <form id="form-orcamento">
      <label for="servico">O que você precisa?</label>
      <textarea id="servico" required
        placeholder="Ex.: assentar azulejo no banheiro, cerca de 6 m²"></textarea>

      <label for="bairro">Bairro</label>
      <input id="bairro" type="text" placeholder="Ex.: Praia da Costa">

      <label for="quando">Para quando?</label>
      <input id="quando" type="text" maxlength="60"
        placeholder="Ex.: a partir do dia 10, sábado de manhã">
      <!-- Sugestões: tocar preenche o campo, que continua editável -->
      <div class="chips sugestoes" id="sugestoes-quando">
        <button type="button" class="chip">O quanto antes</button>
        <button type="button" class="chip">Nesta semana</button>
        <button type="button" class="chip">Neste mês</button>
        <button type="button" class="chip">Sem pressa</button>
      </div>

      <p class="suave" style="margin-top:14px">
        O pedreiro vai responder com um orçamento de serviço, valor e prazo,
        que fica registrado no pedido.
      </p>

      <button class="botao" type="submit">Enviar pedido</button>
    </form>
  </main>

  <script src="js/dados.js"></script>
  <script src="js/estado.js"></script>
  <script src="js/icones.js"></script>
  <script src="js/app.js"></script>
  <script src="js/orcamento.js"></script>
</body>
</html>
