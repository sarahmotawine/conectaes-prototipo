<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1e3a5f">
  <meta name="description" content="Protótipo do ConectaES, plataforma para contratar pedreiros autônomos na Grande Vitória (ES).">
  <title>Buscar pedreiro · ConectaES</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icones/icone-192.png">
  <link rel="apple-touch-icon" href="icones/icone-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <!-- Busca de pedreiros (RF04) -->
  <header class="cabecalho">
    <h1><a class="marca-link" href="index.html" aria-label="ConectaES, página inicial">Conecta<span>ES</span></a></h1>
  </header>

  <main class="conteudo largo">
    <label for="texto" class="titulo-secao" style="margin-top:4px">Que serviço você precisa?</label>
    <div class="campo-busca">
      <span id="icone-busca"></span>
      <input id="texto" type="search" placeholder="Ex.: azulejo, reboco, telhado">
    </div>

    <!-- Filtros de tocar: um por especialidade e um por cidade (ver busca.js) -->
    <div class="chips" id="chips-especialidade" aria-label="Especialidade"></div>
    <div class="chips" id="chips-cidade" aria-label="Cidade"></div>

    <p class="suave" id="contagem"></p>
    <div id="lista"></div>
  </main>

  <script src="js/dados.js"></script>
  <script src="js/estado.js"></script>
  <script src="js/icones.js"></script>
  <script src="js/app.js"></script>
  <script src="js/busca.js"></script>
</body>
</html>
