<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1e3a5f">
  <title>Buscar pedreiro · ConectaES</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icones/icone-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <!-- Busca de pedreiros (RF04) -->
  <header class="cabecalho">
    <h1>ConectaES</h1>
  </header>

  <main class="conteudo largo">
    <label for="texto">Que serviço você precisa?</label>
    <input id="texto" type="search" placeholder="Ex.: azulejo, reboco, telhado">

    <div class="filtros">
      <select id="especialidade" aria-label="Especialidade">
        <option value="">Especialidade</option>
      </select>
      <select id="cidade" aria-label="Cidade">
        <option value="">Cidade</option>
      </select>
    </div>

    <div id="lista"></div>
  </main>

  <script src="js/dados.js"></script>
  <script src="js/estado.js"></script>
  <script src="js/icones.js"></script>
  <script src="js/app.js"></script>
  <script src="js/busca.js"></script>
</body>
</html>
