<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1e3a5f">
  <title>Entrar · ConectaES</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icones/icone-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <!-- Tela de entrar (RF01). No protótipo, qualquer e-mail e senha entram.
       Chega-se aqui pelo botão "Entrar" ou ao tentar uma ação que exige login. -->
  <main class="entrada">
    <section class="entrada-topo">
      <p class="marca">Conecta<span>ES</span></p>
      <p class="slogan">Entre para pedir orçamentos e acompanhar seus pedidos.</p>
    </section>

    <form id="form-entrar" class="entrada-cartao">
      <h1>Entrar</h1>
      <p class="aviso" id="aviso-login" hidden>Para continuar, entre na sua conta ou cadastre-se.</p>

      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="email" required>

      <label for="senha">Senha</label>
      <input id="senha" type="password" autocomplete="current-password" required>

      <button class="botao" type="submit">Entrar</button>

      <p class="suave" style="text-align:center; margin-top:16px">
        Não tem conta? <a id="link-cadastro" href="cadastro.html">Cadastre-se</a>
      </p>
    </form>

    <div class="entrada-pedreiro">
      <p class="suave">É pedreiro? Veja como funciona do seu lado.</p>
      <button class="botao secundario" id="sou-pedreiro" type="button">Sou pedreiro (demonstração)</button>
    </div>

    <a href="index.html" class="reiniciar">Continuar sem entrar</a>
  </main>

  <script src="js/dados.js"></script>
  <script src="js/estado.js"></script>
  <script src="js/app.js"></script>
  <script src="js/entrar.js"></script>
</body>
</html>
