<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1e3a5f">
  <meta name="description" content="Protótipo do ConectaES, plataforma para contratar pedreiros autônomos na Grande Vitória (ES).">
  <title>Criar conta · ConectaES</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icones/icone-192.png">
  <link rel="apple-touch-icon" href="icones/icone-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <!-- Cadastro do cliente (RF01). No protótipo, nada é guardado: ao enviar, entra na conta. -->
  <main class="entrada">
    <section class="entrada-topo">
      <a class="marca" href="index.html" aria-label="ConectaES, página inicial">Conecta<span>ES</span></a>
      <p class="destaque-entrada">Crie sua conta e <strong>encontre o pedreiro certo!</strong></p>
      <p class="slogan">Crie sua conta para pedir orçamentos.</p>
    </section>

    <form id="form-cadastro" class="entrada-cartao compacto">
      <h1>Criar conta</h1>

      <label for="nome">Nome completo</label>
      <input id="nome" type="text" autocomplete="name" required>

      <div class="campos-lado">
        <div>
          <label for="telefone">Celular</label>
          <input id="telefone" type="tel" autocomplete="tel" placeholder="(27) 99999-9999" required>
        </div>
        <div>
          <label for="cidade">Cidade</label>
          <select id="cidade" required>
        <option value="">Escolha</option>
        <option>Cariacica</option>
        <option>Fundão</option>
        <option>Guarapari</option>
        <option>Serra</option>
        <option>Viana</option>
        <option>Vila Velha</option>
        <option>Vitória</option>
          </select>
        </div>
      </div>

      <div class="campos-lado">
        <div>
          <label for="email">E-mail</label>
          <input id="email" type="email" autocomplete="email" required>
        </div>
        <div>
          <label for="senha">Senha</label>
          <input id="senha" type="password" autocomplete="new-password" minlength="6" required>
        </div>
      </div>

      <button class="botao" type="submit">Criar conta</button>

      <p class="suave" style="text-align:center; margin-top:16px">
        Já tem conta? <a id="link-entrar" href="entrar.html">Entrar</a>
      </p>
    </form>
  </main>

  <script src="js/dados.js"></script>
  <script src="js/estado.js"></script>
  <script src="js/icones.js"></script>
  <script src="js/app.js"></script>
  <script src="js/cadastro.js"></script>
</body>
</html>
