<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1e3a5f">
  <title>ConectaES</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icones/icone-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <!-- Tela de entrada (RF01). No protótipo, qualquer e-mail e senha entram. -->
  <main class="entrada">
    <p class="marca">Conecta<span>ES</span></p>
    <p class="suave">Da indicação ao aplicativo.</p>

    <form id="form-entrar">
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="email" required>

      <label for="senha">Senha</label>
      <input id="senha" type="password" autocomplete="current-password" required>

      <button class="botao" type="submit">Entrar</button>
    </form>

    <p class="suave" style="text-align:center; margin-top:16px">
      Não tem conta? <a href="cadastro.html">Cadastre-se</a>
    </p>

    <a href="#" id="reiniciar" class="reiniciar">Reiniciar demonstração</a>
  </main>

  <script src="js/dados.js"></script>
  <script src="js/estado.js"></script>
  <script src="js/app.js"></script>
  <script src="js/entrar.js"></script>
</body>
</html>
